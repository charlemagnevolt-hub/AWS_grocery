services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_URI: ${DOCKER_POSTGRES_URI}
      POSTGRES_HOST: ${DOCKER_POSTGRES_HOST}
      POSTGRES_PORT: ${DOCKER_POSTGRES_PORT}
    restart: unless-stopped
    volumes:
      - ./backend:/app
    command: >
      sh -c "gunicorn --bind 0.0.0.0:5000 run:app"
